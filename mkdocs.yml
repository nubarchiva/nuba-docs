site_name: Documentación de nubarchiva
site_url: https://docs.nubarchiva.es
site_description: Guías de uso de nubarchiva
site_author: Equipo nubarchiva

# Construcción estricta: una página fuera de la navegación es un aviso
validation:
  nav:
    omitted_files: warn

# Repository
repo_name: nuba-docs
repo_url: https://github.com/nubarchiva/nuba-docs

# Copyright
copyright: Copyright &copy; 2025 nubarchiva

# Configuration
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  logo: assets/images/brand/logo-white.svg
  favicon: assets/images/brand/logo.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Poppins
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang: es
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Inicio: index.md
  - Portal de difusión:
      - user-guide/diffusion-portal/index.md
      - Seleccionar un bloque: user-guide/diffusion-portal/select-block.md
      - Ver las demás opciones: user-guide/diffusion-portal/block-options.md
      - Guardar los cambios: user-guide/diffusion-portal/save-changes.md
      - Publicar una página: user-guide/diffusion-portal/publish.md
      - Montar un carrusel: user-guide/diffusion-portal/carousel.md
      - Configurar la caja de búsqueda: user-guide/diffusion-portal/search-box.md
      - Ampliar una imagen: user-guide/diffusion-portal/image-zoom.md
      - Elegir imágenes: user-guide/diffusion-portal/choose-images.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nubarchiva/nuba-docs
      name: nubarchiva en GitHub

# Extra CSS
extra_css:
  - assets/stylesheets/extra.css
