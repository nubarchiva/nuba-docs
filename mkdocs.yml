site_name: Documentación de nubarchiva
site_url: https://docs.nubarchiva.es
site_description: Guías de uso de nubarchiva
site_author: Equipo nubarchiva

# Construcción estricta: una página fuera de la navegación o un enlace a un ancla que no existe es un aviso
validation:
  nav:
    omitted_files: warn
  anchors: warn

# Copyright
copyright: >-
  &copy; 2026 nubarchiva · Contenido bajo licencia
  <a href="https://creativecommons.org/licenses/by/4.0/deed.es">CC BY 4.0</a>

# Configuration
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  logo: assets/images/brand/logo-white.svg
  favicon: assets/images/brand/logo.png
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false

# Plugins
plugins:
  - search:
      lang: es
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Inicio: index.md
  - Publicar en el OPAC: user-guide/publish-in-opac.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nubarchiva/nuba-docs
      name: nubarchiva en GitHub

# Extra CSS
extra_css:
  - assets/stylesheets/extra.css
